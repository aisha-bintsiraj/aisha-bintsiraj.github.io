<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Адыгэбзэ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Адыгэбзэ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Manrope:wght@500;600;700;800&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0A1430;--bg2:#0F1D42;--card:#13244F;--card2:#1A2E60;--line:#26407A;
 --white:#F6F3EB;--soft:#B9C3DA;--gold:#E2BE6A;--gold2:#F3D99A;--goldd:#B8913E;
 --a:#2C4C9A;--b:#3B2F6B;--c:#1D5560;--ok:#7FD1A8;--no:#F29C8B;--pal:#F3D99A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--white);font-family:'Manrope',system-ui,sans-serif;font-size:18px;line-height:1.5;min-height:100vh;
 background:radial-gradient(900px 500px at 90% -10%,#1C3270 0%,transparent 60%),radial-gradient(700px 400px at -10% 110%,#1A2B5E 0%,transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer}
.app{max-width:720px;margin:0 auto;padding:0 16px 110px}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font-family:'Aref Ruqaa',serif;font-size:40px;color:var(--gold);line-height:1;text-shadow:0 0 18px rgba(226,190,106,.35)}
.brand{text-align:right;font-size:12px;letter-spacing:.14em;color:var(--soft);font-weight:700}
.brand b{display:block;color:var(--gold2);font-size:15px;letter-spacing:.06em}
h1{font-family:'Cormorant Garamond',serif;font-size:36px;line-height:1.1;color:var(--white);margin:6px 0 4px}
h2{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--gold2);margin:22px 0 10px;line-height:1.15}
h3{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px;font-weight:800}
.sub{color:var(--soft);font-size:16px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.gold-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0;opacity:.6}
.pal{color:var(--pal);font-weight:800}
.kb{font-weight:800;color:var(--white)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(10,20,48,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-around}
nav button{background:none;border:0;color:var(--soft);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:12px;min-width:62px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--gold2)}
nav button.on .ic{filter:drop-shadow(0 0 6px rgba(226,190,106,.6))}
.view{display:none;animation:fade .25s}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
/* home */
.hero{background:linear-gradient(135deg,#1D3576,#122656 60%,#2A2150);border:1px solid var(--goldd);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(var(--gold) 0%,transparent 70%);opacity:.18}
.hero .lbl{font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:800;text-transform:uppercase}
.hero .w{font-size:34px;font-weight:800;margin:6px 0 2px}
.hero .t{color:var(--gold2);font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold2)}
.stat span{font-size:13px;color:var(--soft)}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--goldd),var(--gold2));border-radius:99px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;color:var(--white)}
.tile b{display:block;font-size:17px;margin-top:6px}.tile span{font-size:13px;color:var(--soft)}
/* chips & inputs */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--white);border-radius:99px;padding:9px 15px;font-size:15px;font-weight:700}
.chip.on{background:var(--gold);color:#0A1430;border-color:var(--gold)}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--white);border-radius:14px;padding:13px 16px;font:600 17px 'Manrope',system-ui,sans-serif;margin:6px 0 8px}
.search::placeholder{color:#7F8BAA}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--white);border-radius:14px;padding:12px 16px;font-size:16px;font-weight:800}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0A1430;border:0}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.modes button{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--goldd);color:var(--white);border-radius:16px;padding:14px 6px;font-weight:800;font-size:15px}

/* word list */
.wl{display:flex;flex-direction:column;gap:8px}
.wi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.wi .k{font-size:21px;font-weight:800;flex:1;min-width:0}
.wi .r{display:block;font-size:16px;font-weight:600;color:var(--gold2)}
.st{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--soft);font-size:15px;flex:0 0 auto}
.st.s1{border-color:var(--gold);color:var(--gold)}
.st.s2{border-color:var(--ok);background:var(--ok);color:#0A1430}
.more{display:block;margin:12px auto 0}
/* flashcard */
.fc{perspective:1200px;margin:8px 0 14px}
.fc-in{position:relative;height:300px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--goldd)}
.front{background:linear-gradient(150deg,#22408A,#152A5E)}
.back{background:linear-gradient(150deg,#2D2766,#1A2D62);transform:rotateY(180deg)}
.side .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:12px}
.side .big{font-size:32px;font-weight:800;line-height:1.25}
.side .hint{position:absolute;bottom:14px;font-size:13px;color:var(--soft)}
.know{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.know .btn{padding:16px;font-size:17px}
.know .no{background:#3A2440;border-color:#6B3E5A}
.know .yes{background:#1E4B45;border-color:#2F7A68}
.prog{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-bottom:6px}
/* quiz */
.qz-q{font-size:30px;font-weight:800;text-align:center;margin:18px 0 6px}
.qz-s{text-align:center;color:var(--soft);margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:1px solid var(--line);color:var(--white);border-radius:16px;padding:15px;font-size:18px;font-weight:700;text-align:left}
.opt.ok{background:#1E4B45;border-color:var(--ok)}
.opt.bad{background:#4A2433;border-color:var(--no)}
/* lessons */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--line))}
.ls{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;color:var(--white)}
.ls:before{content:"";position:absolute;left:-21px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.ls.done:before{background:var(--gold)}
.ls .d{font-size:13px;color:var(--gold);font-weight:800;letter-spacing:.06em}
.ls b{display:block;font-size:19px;margin:2px 0}
.ls .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;background:var(--bg2);border:1px solid var(--line);color:var(--soft);border-radius:99px;padding:3px 9px;font-weight:700}
.back-btn{background:none;border:0;color:var(--gold);font-size:16px;font-weight:800;padding:8px 0}
.phr{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px dashed var(--line)}
.phr:last-child{border:0}
.phr .k{font-size:20px;font-weight:800}.phr .r{color:var(--gold2);font-size:16px}
.note{background:rgba(226,190,106,.1);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px}
.tip{background:rgba(226,190,106,.08);border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:16px}
/* hw */
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk:last-child{border:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--gold);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0A1430;margin-top:1px}
.chk.on .box{background:var(--gold)}
.chk.on span{color:var(--soft);text-decoration:line-through}
/* dialogs */
.dl-list .ls:before{display:none}
.bubbles{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.bb{max-width:86%;padding:12px 15px;border-radius:20px;position:relative}
.bb .who{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--gold2);text-transform:uppercase;margin-bottom:3px}
.bb .k{font-size:19px;font-weight:700;line-height:1.4}
.bb .r{font-size:15px;color:var(--soft);margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.12)}
.bb.L{align-self:flex-start;border-bottom-left-radius:6px}
.bb.R{align-self:flex-end;border-bottom-right-radius:6px}
.bb.a{background:var(--a)}.bb.b{background:var(--b)}.bb.c{background:var(--c)}
.bb.hid .k{filter:blur(8px);user-select:none}
.bb.hid:after{content:"твоя реплика — скажи вслух и нажми";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--gold2)}
.bb.hid.show .k{filter:none}.bb.hid.show:after{display:none}
.narr{align-self:center;font-size:14px;color:var(--gold);font-weight:700;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 14px;text-align:center}
.noru .bb .r{display:none}
.noru .phr .r,.noru .para .r{filter:blur(7px)}
.para{margin:8px 0 14px}.para .k{font-size:20px;font-weight:700;line-height:1.5}.para .r{color:var(--gold2);font-size:16px;margin-top:2px}
/* reading */
.poem{white-space:pre-line;font-size:22px;font-weight:700;line-height:1.6;text-align:center;padding:10px 0}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--goldd)}
.dots i.f{background:var(--gold)}
.gloss{font-size:14px;color:var(--soft);margin-top:10px;line-height:1.6}
/* grammar */
.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;margin:6px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tb td,.tb th{padding:9px 10px;border-bottom:1px solid var(--line)}
.tb th{background:var(--bg2);color:var(--gold);font-size:13px;text-align:left}
.tb tr:last-child td{border:0}
.tb b{color:var(--gold2)}
.qg,.pairs,.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.qg div,.pairs div,.nums div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px}
.qg b,.pairs b{display:block;font-size:19px;color:var(--gold2)}
.nums{grid-template-columns:repeat(5,1fr)}
.nums div{text-align:center;color:var(--soft)}.nums b{display:block;font-size:17px;color:var(--white)}
.flow{display:grid;gap:10px}
.fbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px}
.fbox .lbl{display:block;color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.fbox .ex{font-size:19px;font-weight:700;margin:8px 0;color:var(--white)}
.r{color:var(--ok)} .m{color:#FFB38A}
.fbox .ex .r{color:var(--ok)}
.ul{padding-left:20px;font-size:16px}.ul li{margin:4px 0}
.gacc{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--white);font-size:19px;font-weight:800;padding:2px 0}
.gacc:after{content:"＋";color:var(--gold)}.open .gacc:after{content:"−"}
.gbody{display:none;margin-top:8px}.open .gbody{display:block}
/* exercises */
.ex{padding:10px 0;border-bottom:1px dashed var(--line)}
.ex .q{font-size:18px;font-weight:700}
.ex .a{display:none;color:var(--ok);font-weight:700;margin-top:4px}
.ex.on .a{display:block}
/* notebook */
textarea,input.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:14px;color:var(--white);font:600 17px 'Manrope',system-ui,sans-serif;padding:12px;margin:6px 0}
textarea{min-height:170px;line-height:1.5}
label{font-weight:800;color:var(--gold);font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:10px}
.entry .t{font-size:19px;font-weight:800}.entry .d{font-size:13px;color:var(--gold)}
.entry .body{white-space:pre-wrap;margin-top:6px;font-size:17px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#0A1430;font-weight:800;padding:12px 18px;border-radius:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.8);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--goldd);border-radius:24px 24px 0 0;width:100%;max-width:720px;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.empty{text-align:center;color:var(--soft);padding:24px}
footer{text-align:center;color:var(--soft);font-size:13px;margin-top:30px}
footer .logo{font-size:30px;display:block}

/* ===== СВЕТЛАЯ ТЕМА ===== */
body.light{--bg:#F7F3EA;--bg2:#F0EADC;--card:#FFFFFF;--card2:#FFFFFF;--line:#E4D9C2;
 --white:#14234B;--soft:#5D6785;--gold:#A87A22;--gold2:#8E6516;--goldd:#D9B66A;--pal:#B5480E;--ok:#1F8A5B;--no:#C2412D;
 background:radial-gradient(900px 500px at 90% -10%,#FBEFD3 0%,transparent 60%),radial-gradient(700px 400px at -10% 110%,#E8EEFA 0%,transparent 60%),#F7F3EA}
body.light .card,body.light .tile,body.light .wi,body.light .ls,body.light .stat,body.light .opt{box-shadow:0 2px 10px rgba(20,35,75,.06)}
body.light .card{background:#fff}
body.light .logo{color:#B08327;text-shadow:none}
body.light .hero{background:linear-gradient(135deg,#14234B,#1E3470);border:0;color:#F6F3EB}
body.light .hero .w{color:#fff}body.light .hero .t{color:#F3D99A}body.light .hero .lbl{color:#E2BE6A}
body.light .hero .tag{background:rgba(255,255,255,.12);color:#DCE3F5;border-color:transparent}
body.light .hero .pal,body.light .daily .pal{color:#F3D99A}
body.light nav{background:rgba(255,255,255,.96);border-top:1px solid #E4D9C2}
body.light nav button.on{color:#14234B}
body.light nav button.on .ic{filter:none}
body.light nav button.on:after{content:"";width:22px;height:3px;border-radius:3px;background:#C9973A;margin-top:2px}
body.light .chip.on,body.light .btn.gold{background:linear-gradient(135deg,#E9C77B,#D4A84A);color:#14234B}
body.light .modes button{background:#fff;border-color:#E4D9C2;color:#14234B}
body.light .front{background:linear-gradient(150deg,#14234B,#22397A);color:#F6F3EB;border:0}
body.light .back{background:linear-gradient(150deg,#FFF8E6,#F6E7C2);border-color:#D9B66A}
body.light .front .pal{color:#F3D99A}
body.light .front .hint{color:#B9C3DA}body.light .front .l{color:#E2BE6A}
body.light .know .no{background:#FBE9E4;border-color:#EBC3B8;color:#8A2E1F}
body.light .know .yes{background:#E3F4EB;border-color:#A9D9BF;color:#145C3C}
body.light .opt.ok{background:#E3F4EB;border-color:#1F8A5B}
body.light .opt.bad{background:#FBE9E4;border-color:#C2412D}
body.light .bb{color:#14234B}
body.light .bb.a{background:#E4EBFB}body.light .bb.b{background:#F1E9F8}body.light .bb.c{background:#E0F2EF}
body.light .bb .who{color:#8E6516}
body.light .bb .r{color:#5D6785;border-top-color:rgba(20,35,75,.12)}
body.light .note,body.light .tip{background:#FBF3E0}
body.light .modal{background:rgba(20,35,75,.45)}
body.light .sheet{background:#FBF8F1}
body.light .search,body.light textarea,body.light input.in{background:#fff}
body.light .search::placeholder{color:#9AA1B8}
body.light .top{background:linear-gradient(#F7F3EA 70%,transparent)}
body.light .fbox .ex .r,body.light .r.ok{color:#1F8A5B}
body.light .m{color:#C25A12}
body.light .toast{background:#14234B;color:#F3D99A}
body.light .st.s2{color:#fff}
body.light .chk.on .box{color:#fff}

body.light .daily{background:linear-gradient(135deg,#FFF8E8,#F7E8C4);color:#14234B;border:1.5px solid #D9B66A;box-shadow:0 6px 20px rgba(168,122,34,.15)}
body.light .daily h3{color:#8E6516}
body.light .daily div[style*="B9C3DA"],body.light .daily .meta{color:#5D6785!important}
body.light .daily .dw div{background:#fff;box-shadow:0 1px 4px rgba(20,35,75,.06)}
body.light .daily .dw span{color:#8E6516}
body.light .daily .pal{color:#B5480E}
body.light .daily .lnk{color:#8E6516}
body.light .steps button{background:#fff;color:#14234B;border-color:#D9B66A}
body.light .steps button.done{background:#14234B;color:#F3D99A;border-color:#14234B}
body.light .hero:after{display:none}
body.light .hero{background:#fff;border:1.5px solid #E4D9C2;color:#14234B}
body.light .hero .w{color:#14234B}body.light .hero .t{color:#8E6516}body.light .hero .lbl{color:#A87A22}
body.light .hero .tag{background:#F0EADC;color:#5D6785}
body.light .hero .pal{color:#B5480E}
body.light .front{background:#fff;color:#14234B;border:1.5px solid #D9B66A}
body.light .front .pal{color:#B5480E}body.light .front .hint{color:#5D6785}body.light .front .l{color:#A87A22}
.daily .steps{grid-template-columns:1fr 1fr}
.daily .steps button{display:flex;align-items:center;gap:8px;justify-content:flex-start;font-size:15px;padding:10px}
.daily .steps button span{margin:0!important}
.modes button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.modes button span{margin:0!important}
html,body{overflow-x:hidden}
.gbody,.card{overflow-wrap:anywhere}
.tb{table-layout:fixed;font-size:15px}
.tb td,.tb th{padding:8px 6px;word-break:break-word;vertical-align:top}
.tb.cases th:nth-child(1),.tb.cases td:nth-child(1){width:31%}
.tb.cases th:nth-child(2),.tb.cases td:nth-child(2){width:19%}
.wk{background:linear-gradient(135deg,#FFFFFF,#EEF2FC);border:1.5px solid #C9D3EE;border-radius:20px;padding:16px;margin:12px 0}
.wk.due{border-color:#D4A84A;background:linear-gradient(135deg,#FFF8E8,#F7E8C4)}
.wk h3{margin:0 0 4px}

/* ===== кнопка «Добавить» ===== */
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(135deg,#E9C77B,#C9973A);color:#14234B;box-shadow:0 8px 22px rgba(168,122,34,.4);display:flex;align-items:center;justify-content:center}
.fab .ico{width:30px;height:30px;stroke-width:2.2}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.seg button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;font-weight:800;font-size:13px;color:var(--white);display:flex;flex-direction:column;align-items:center;gap:4px}
.seg button.on{border-color:var(--gold);background:#FBF0D6;color:#14234B}
.seg button .ico{width:22px;height:22px;color:var(--gold)}
.found{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.found h4{font-size:14px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.found .li{font-size:16px;padding:3px 0;border-bottom:1px dashed var(--line)}
.found .li:last-child{border:0}
.found .li b{font-weight:800}.found .li span{color:var(--gold2)}
.mine-tag{background:#FBF0D6!important;color:#8E6516!important;border-color:#E9C77B!important}

/* ===== приложение ===== */
.top{padding-top:calc(16px + env(safe-area-inset-top))}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(600px 400px at 50% 30%,#FFFDF7,#F3E7CB);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .frame{position:absolute;inset:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));border:2px solid #D4A84A;border-radius:34px;pointer-events:none}
#splash .frame:after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,151,58,.45);border-radius:27px}
#splash .orn{width:190px;height:30px;margin-bottom:22px;animation:rise .9s ease both}
#splash .cal{font-family:'Aref Ruqaa',serif;font-size:54px;color:#B08327;line-height:1;animation:rise .9s .1s ease both}
#splash .name{font-family:'Cormorant Garamond',Lora,serif;font-weight:700;font-size:66px;color:#14234B;line-height:1.05;margin-top:18px;animation:rise .9s .2s ease both}
#splash .name b{color:#C9973A}
#splash .sub2{font-family:'Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:.32em;font-size:13px;color:#8E6516;margin-top:12px;animation:rise .9s .3s ease both}
#splash .line{width:0;height:2px;background:linear-gradient(90deg,transparent,#C9973A,transparent);margin-top:26px;animation:grow 1.1s .35s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{to{width:180px}}
.migr{background:#fff;border:1.5px dashed #D4A84A;border-radius:18px;padding:14px 16px;margin:12px 0}
.theme{background:none;border:1px solid var(--line);color:var(--white);border-radius:99px;padding:6px 10px;font-size:15px;font-weight:700;margin-left:8px}

/* иконки */
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
i[data-i]{font-style:normal;display:inline-flex;align-items:center;justify-content:center}
h3 i[data-i],.btn i[data-i],.chip i[data-i],.tag i[data-i],.lnk i[data-i]{margin-right:.35em}
nav button .ic .ico{width:25px;height:25px}
nav button .ic{height:26px}
.tile span.badge,.modes button span,.steps button span{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,rgba(226,190,106,.28),rgba(226,190,106,.12));color:var(--gold);margin:0 auto 6px}
.tile span.badge{margin:0 0 4px}
.tile span.badge .ico,.modes button span .ico{width:24px;height:24px}
.steps button span{width:36px;height:36px;border-radius:11px}
.steps button span .ico{width:20px;height:20px}
body.light .tile span.badge,body.light .modes button span,body.light .steps button span{background:linear-gradient(135deg,#FBEFD0,#F4E2B5);color:#8E6516}
body.light .steps button.done span{background:rgba(243,217,154,.18);color:#F3D99A}
.theme .ico{width:18px;height:18px;vertical-align:-3px}
.theme{margin-left:8px}
.bigic{display:inline-flex;width:76px;height:76px;border-radius:24px;align-items:center;justify-content:center;background:linear-gradient(135deg,#FBEFD0,#F1DCA8);color:#8E6516}
.bigic .ico{width:40px;height:40px}
.modes{grid-template-columns:repeat(3,1fr)}
.modes button{font-size:14px;padding:12px 4px}
.steps{grid-template-columns:repeat(2,1fr)}
.steps button{font-size:15px;padding:10px 6px;display:flex;align-items:center;gap:8px;justify-content:flex-start}
.steps button span{margin:0!important}
/* аудио */
.aud{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aud audio{width:100%;height:40px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* собери фразу */
.slots{min-height:64px;background:var(--bg2);border:1.5px dashed var(--goldd);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.wchip{background:var(--card);border:1.5px solid var(--line);color:var(--white);border-radius:12px;padding:10px 13px;font-size:18px;font-weight:800;box-shadow:0 2px 6px rgba(20,35,75,.06)}
.slots .wchip{border-color:var(--gold)}
.res{font-weight:800;margin:8px 0;font-size:17px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
/* пишу сама */
.typein{font-size:22px!important;text-align:center;font-weight:800!important}
.ans{text-align:center;font-size:20px;font-weight:800;margin:10px 0}
.kbd{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 10px}
.kbd button{background:var(--card);border:1px solid var(--line);color:var(--white);border-radius:10px;padding:8px 12px;font-weight:800;font-size:17px}
/* daily */
.daily{background:linear-gradient(135deg,#14234B,#1E3470);color:#F6F3EB;border-radius:24px;padding:18px;margin:14px 0}
.daily h3{color:#E2BE6A;margin:0 0 4px}
.daily .dw{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0}
.daily .dw div{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.daily .dw b{font-size:20px}.daily .dw span{color:#F3D99A;font-size:15px;text-align:right}
.daily .dw .hide span{filter:blur(6px)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps button{background:rgba(255,255,255,.1);border:1px solid rgba(226,190,106,.5);color:#fff;border-radius:14px;padding:11px 4px;font-weight:800;font-size:14px}
.steps button.done{background:#E2BE6A;color:#14234B}

.daily .meta{font-size:13px;color:#B9C3DA;margin-top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.daily .lnk{background:none;border:0;color:#F3D99A;font-weight:800;font-size:13px;text-decoration:underline}
.week{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--soft)}
.week i{display:block;height:30px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);margin-bottom:3px;line-height:28px;font-style:normal;font-size:14px}
.week i.f{background:var(--gold);border-color:var(--gold);color:#fff}
@media(max-width:420px){h1{font-size:31px}.side .big{font-size:27px}.nums{grid-template-columns:repeat(4,1fr)}}

numbers:{t:"Числа",html:`<div class="nums"><div><b>Зы</b>1</div><div><b>ТIу</b>2</div><div><b>Щы</b>3</div><div><b>ПлIы</b>4</div><div><b>Тху</b>5</div><div><b>Хы</b>6</div><div><b>Блы</b>7</div><div><b>И</b>8</div><div><b>Бгъу</b>9</div><div><b>Пщы</b>10</div><div><b>ТIощI</b>20</div><div><b>ЩэщI</b>30</div><div><b>ПлIыщI</b>40</div></div><p class="tip">Число прилипает к слову: <i>Зы цIыху</i> — один человек, <i>цIыхуитI</i> — два человека, <i>цIыхуитху</i> — пять, <i>цIыхуибл</i> — семь, <i>пэшищ</i> — три комнаты.</p>`},
cases:{t:"4 падежа",html:`<table class="tb cases"><tr><th>Падеж</th><th>Конец</th><th>Вопрос</th><th>Пример</th></tr><tr><td>Именит.</td><td><b>-р</b></td><td>сытыр? хэтыр?</td><td>тхылъы<b>р</b>, къуажэ<b>р</b></td></tr><tr><td>Эргатив.</td><td><b>-м</b></td><td>сытым? хэтым?</td><td>тхылъы<b>м</b>, къуажэ<b>м</b></td></tr><tr><td>Послелож.</td><td><b>-мкIэ</b></td><td>сытымкIэ?</td><td>тхылъы<b>мкIэ</b></td></tr><tr><td>Обстоят.</td><td><b>-у / -рауэ</b></td><td>сыту? сытырауэ?</td><td>тхылъ<b>у</b>, тхылъы<b>рауэ</b></td></tr></table><p class="tip"><b>Определённое и неопределённое</b> (урок 10):<br>ЩIалэр / ЩIалэ · ЩIалэм / ЩIалэ · ЩIалэмкIэ / ЩIалэкIэ · ЩIалэрауэ / ЩIалэу<br><i>-р, -м</i> — «тот самый» парень; без окончания — «какой-то» парень.</p><p class="tip">Если слово кончается на согласный, добавляется <b>ы</b>: шэнт → шэнт<b>ы</b>р. На гласный — сразу: мажьэ → мажьэр.</p><p class="tip"><b>-мкIэ</b> — чем? или по чему?: <i>КъэлэмымкIэ тхын</i> — писать карандашом; <i>УэрамымкIэ кIуэн</i> — идти по улице.<br><b>-у</b> — в качестве кого: <i>ЛэжьакIуэу мэлажьэ</i> — работает рабочим.</p>`},
ergative:{t:"Эргатив: -р или -м?",html:`<div class="flow"><div class="fbox"><span class="lbl">Глагол НЕпереходный</span>(действие ни на что не направлено: идти, спать, сидеть)<div class="ex">ЩIалэ<b class="r">р</b> макIуэ.<br><i>Парень идёт.</i></div>Кто делает → <b class="r">-р</b></div><div class="fbox"><span class="lbl">Глагол переходный</span>(действие на предмет: писать что-то, есть что-то)<div class="ex">ЩIалэ<b class="m">м</b> тхылъы<b class="r">р</b> етх.<br><i>Парень пишет книгу.</i></div>Кто делает → <b class="m">-м</b>, что делает → <b class="r">-р</b></div></div><p class="tip">В русском «я» всегда в именительном. В кабардинском падеж зависит от <b>глагола</b>, а не от вопроса «кому? чему?».</p>`},
transitive:{t:"Переходный или нет?",html:`<p><b>Всегда НЕпереходные:</b></p><ul class="ul"><li>движение: макIуэ (идёт), мажэ (бежит), йожьэ (отправляется)</li><li>состояние: жеин (спит), мэпсэу (живёт), малIэ (умирает)</li><li>с приставкой <b>мэ-/ма-</b>: мэлажьэ (работает), мэджэгу (играет), матхэ (пишет), мэпсалъэ (разговаривает)</li><li>косвенные: йоджэ (читает), еплъы (смотрит на), едаIуэ (слушает)</li></ul><p><b>Всегда переходные:</b></p><ul class="ul"><li>создать / сломать: тхын (писать что-то), щIын (делать), дын (шить что-то), гъэвэн (варить), къутэн (ломать)</li><li>переместить: хьын (нести), шэн (вести), дзын (бросать), гъэувын (ставить)</li><li>восприятие: лъагъун (видеть), щIэн (знать), хэщIыкIын (понимать)</li><li>с приставкой <b>гъэ-</b> «заставить»: жеин → гъэжеин (усыплять), кIуэн → гъэкIуэн (посылать)</li></ul><div class="pairs"><div><b>Тхэн</b> писать</div><div><b>Тхын</b> писать что-то</div><div><b>Дэн</b> шить</div><div><b>Дын</b> шить что-то</div><div><b>ПщэфIэн</b> готовить</div><div><b>ПщэфIын</b> готовить что-то</div><div><b>Еджэн</b> читать, учиться</div><div><b>Джын</b> изучать что-то</div></div><p class="tip"><i data-i=sparkle></i><b>Золотое правило:</b> подставь «Сэ ар (сощIэ)» — «Я это (делаю)». Подходит «ар» — глагол переходный. Нужно «абы» — непереходный.</p>`},
dynstat:{t:"Динамические и статические",html:`<div class="flow"><div class="fbox"><span class="lbl">Динамические</span>действие, процесс<div class="ex">Сэ <b>со</b>кIуэ — я иду<br>Уэ <b>уо</b>кIуэ — ты идёшь<br>Ар <b>ма</b>кIуэ — он идёт</div>приставки <b>о-</b>, а для 3-го лица — <b>мэ/ма</b></div><div class="fbox"><span class="lbl">Статические</span>состояние, положение<div class="ex">Сэ сыщыт<b>щ</b> — я стою<br>Уэ ущыт<b>щ</b> — ты стоишь<br>Ар щыт<b>щ</b> — он стоит</div>суффикс утверждения <b>-щ</b></div></div><p class="tip">Статические почти все непереходные. Исключения: <b>Iыгъын</b> (держать) и <b>щыгъын</b> (быть одетым): <i>ЩIалэм плIэр щыгъщ</i> — парень одет в рубашку.</p><div class="pairs"><div><b>Тетын</b> стоять на чём-то</div><div><b>Тесын</b> сидеть на чём-то</div><div><b>Телъын</b> лежать на чём-то</div><div><b>ЩIэтын</b> стоять внутри</div></div>`},
persons:{t:"По лицам: тхэн и тхын",html:`<table class="tb"><tr><th></th><th>тхэн (непереходн.)</th><th>тхын (переходн.)</th></tr><tr><td>Сэ</td><td>сотхэ</td><td>сотх</td></tr><tr><td>Уэ</td><td>уотхэ</td><td>уотх</td></tr><tr><td>Ар</td><td>матхэ</td><td>(абы) етх</td></tr><tr><td>Дэ</td><td>дотхэ</td><td>дотх</td></tr><tr><td>Фэ</td><td>фотхэ</td><td>фотх</td></tr><tr><td>Ахэр</td><td>матхэ</td><td>(абыхэм) ятх</td></tr></table><p class="tip">Хъыджэбзы<b>р</b> матхэ · Хъыджэбзы<b>м</b> тхылъыр етх · Хъыджэбзыр ручкэ<b>мкIэ</b> матхэ</p><p class="tip">Анэр мэпщафIэ — мама готовит.<br>Анэм лыр епщэфI — мама готовит мясо.<br>Лыр шэнтым тесщ — мужчина сидит на стуле.</p>`}
};

<script>
// ===== хранилище =====
const KEY="adyghe_aisha_v1";
let S={mylessons:[],miss:{},wk:{},mydlg:{},st:{},hw:{},reads:{},my:[],notes:[],days:[],ex:{},hist:{},dsteps:{},dn:5,theme:"light"};
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)S=Object.assign(S,x)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function markDay(){const d=new Date().toISOString().slice(0,10);if(!S.days.includes(d)){S.days.push(d);save()}}
function streak(){let n=0,d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else break}return n}

// ===== слова =====
function allWords(){
 const seen={},out=[];
 LESSONS.forEach(l=>l.words.forEach(w=>{const id=w[0]+"|"+w[1];if(seen[id])return;seen[id]=1;out.push({id,k:w[0],r:w[1],t:w[2],l:l.id,ln:l.n+" · "+l.date})}));
 S.my.forEach((w,i)=>out.push({id:"my|"+i+"|"+w.k,k:w.k,r:w.r,t:"my",l:"my",ln:"Мои слова",my:i}));
 return out;
}
let WORDS=allWords();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// палочка: I, l, 1, Ӏ после/перед кириллицей → подсвеченная I
function pal(s){
 const t=String(s).replace(/([а-яёА-ЯЁ])[Il1Ӏӏ]/g,"$1\u0001").replace(/[Il1Ӏӏ](?=[а-яёА-ЯЁ])/g,"\u0001");
 return esc(t).replace(/([а-яёА-ЯЁ]?)\u0001/g,'<span class="pal">$1I</span>');
}
const st=id=>S.st[id]||0; // 0 новое, 1 учу, 2 знаю

function toast(t){const e=document.getElementById("toast");e.innerHTML=t;hydrate(e);e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
function modal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("on")}
function closeModal(){document.getElementById("modal").classList.remove("on")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

// ===== навигация =====
let cur="home";
function go(v,arg,b){
 cur=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v||(v==="gram"&&b.dataset.v==="lessons")));
 document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
 R[v](arg,b);window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const R={};


// ===== тема =====
function applyTheme(){document.body.classList.toggle("light",S.theme!=="dark");const b=document.getElementById("thm");if(b)b.innerHTML=ic(S.theme==="dark"?"sun":"moon")}
function toggleTheme(){S.theme=S.theme==="dark"?"light":"dark";save();applyTheme()}
applyTheme();

// ===== 5 СЛОВ В ДЕНЬ =====
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return dkey(d)}
function byId(id){return WORDS.find(w=>w.id===id)}
function dailyPool(){
 const used=new Set(Object.values(S.hist).flat());
 return WORDS.filter(w=>!["sounds"].includes(w.t)&&w.k.length<=22&&!/[?!]/.test(w.k)&&st(w.id)!==2&&!used.has(w.id));
}
function ensureDaily(){
 const t=dkey();
 if(!S.hist[t]||!S.hist[t].length){S.hist[t]=dailyPool().slice(0,S.dn).map(w=>w.id);save()}
 return S.hist[t].map(byId).filter(Boolean);
}
function reviewDue(){const ids=[];[1,3,7,14].forEach(n=>{(S.hist[daysAgo(n)]||[]).forEach(id=>{if(!ids.includes(id))ids.push(id)})});return ids.map(byId).filter(Boolean)}
function dStep(n){const t=dkey();S.dsteps[t]=S.dsteps[t]||{};S.dsteps[t][n]=1;markDay();save()}
function dailyDone(t){const x=S.dsteps[t||dkey()];return x&&x[1]&&x[2]&&x[3]}
function dailyHTML(){
 const W=ensureDaily(),x=S.dsteps[dkey()]||{},rev=reviewDue();
 if(!W.length)return `<div class="daily"><h3><i data-i=star></i>Слова на сегодня</h3><p>Все слова из уроков уже пройдены! Добавь новые в «Мои слова».</p></div>`;
 return `<div class="daily"><div class="row" style="justify-content:space-between"><h3><i data-i=star></i>${W.length} слов на сегодня</h3>${dailyDone()?'<span style="color:#7FD1A8;font-weight:800">✓ выучено</span>':""}</div>
 <div style="font-size:14px;color:#B9C3DA">Нажми на слово, чтобы скрыть или показать перевод</div>
 <div class="dw">${W.map(w=>`<div onclick="this.classList.toggle('hide')"><b>${pal(w.k)}</b><span>${esc(w.r)}</span></div>`).join("")}</div>
 <div class="steps"><button class="${x[1]?"done":""}" onclick="dailyLook()"><span><i data-i=intro></i></span>1. Смотреть</button><button class="${x[2]?"done":""}" onclick="dailyCards()"><span><i data-i=cards></i></span>2. Карточки</button><button class="${x[3]?"done":""}" onclick="dailyQuiz()"><span><i data-i=target></i></span>3. Тест</button><button class="${x[4]?"done":""}" onclick="dailyWrite()"><span><i data-i=pen></i></span>4. Фраза</button></div>
 <div class="meta"><span>${rev.length?`<i data-i=repeat></i>На повторение: ${rev.length} слов`:"Повторение появится завтра"}</span><span>${rev.length?`<button class="lnk" onclick="reviewStart()">Повторить</button> · `:""}<button class="lnk" onclick="moreDaily()">＋ ещё ${S.dn}</button> · <button class="lnk" onclick="dailySettings()"><i data-i=gear></i>${S.dn} в день</button></span></div></div>`;
}
function dailyLook(){
 const W=ensureDaily();let i=0;
 const show=()=>{const w=W[i];modal(`<div class="row" style="justify-content:space-between"><b style="color:var(--gold2)"><i data-i=intro></i>Знакомство · ${i+1} из ${W.length}</b><button class="btn sm" onclick="closeModal()">✕</button></div>
 <div class="bar" style="margin:10px 0 18px"><i style="width:${(i+1)/W.length*100}%"></i></div>
 <div style="text-align:center;padding:16px 0"><div style="font-size:40px;font-weight:800">${pal(w.k)}</div><div style="font-size:22px;color:var(--gold2);margin-top:6px">${esc(w.r)}</div>
 <div class="sub" style="margin-top:14px">${esc(w.ln)}</div>
 <div class="tip" style="text-align:left;margin-top:18px"><i data-i=voice></i>Скажи слово вслух 3 раза, потом закрой глаза и представь его.</div></div>
 <button class="btn gold" style="width:100%" id="nx">${i<W.length-1?"Дальше →":"Готово ✓"}</button>`);

function weekKey(d){d=new Date(d||Date.now());const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dkey(d)}
function weekWords(){
 const ids=new Set();for(let i=0;i<7;i++)(S.hist[daysAgo(i)]||[]).forEach(x=>ids.add(x));
 for(let i=7;i<35;i++)(S.hist[daysAgo(i)]||[]).forEach(x=>{if(st(x)!==2)ids.add(x)});
 Object.entries(S.miss).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([x])=>ids.add(x));

}

function hardStart(){const L=Object.entries(S.miss).sort((a,b)=>b[1]-a[1]).map(([x])=>byId(x)).filter(Boolean).slice(0,15);if(!L.length)return toast('Пока нет трудных слов — ты молодец!');deck=L;di=0;dailyMode=null;cards('hard')}
function miss(id){S.miss[id]=(S.miss[id]||0)+1}
function setSt(id,v){S.st[id]=v;markDay();save()}
function cycleSt(id,el){const v=(st(id)+1)%3;setSt(id,v);el.className="st s"+v;el.textContent=["","…","✓"][v]}
function filtered(){
 return WORDS.filter(w=>(wTopic==="all"||w.t===wTopic)&&(wLesson?w.l===wLesson:true)&&
  (wFilter==="all"||(wFilter==="new"&&st(w.id)===0)||(wFilter==="learn"&&st(w.id)===1)||(wFilter==="known"&&st(w.id)===2))&&
  (!wQuery||(w.k+" "+w.r).toLowerCase().replace(/[l1ӏ]/g,"i").includes(wQuery.toLowerCase().replace(/[l1ӏ]/g,"i"))));
}

 <div class="chips"><button class="chip ${wTopic==="all"?"on":""}" data-t="all">Все темы</button>${tps}<button class="chip ${wTopic==="my"?"on":""}" data-t="my"><i data-i=star></i>Мои слова</button></div>

 <div class="wl">${L.slice(0,wLimit).map(w=>`<div class="wi"><div class="k">${pal(w.k)}<span class="r">${esc(w.r)}</span></div><button class="st s${st(w.id)}" onclick="cycleSt('${esc(w.id).replace(/'/g,"\\'")}',this)">${["","…","✓"][st(w.id)]}</button></div>`).join("")||`<div class="empty">Ничего не найдено</div>`}</div>
 ${L.length>wLimit?`<button class="btn more" onclick="wLimit+=80;R.words()">Показать ещё (${L.length-wLimit})</button>`:""}`;
 const q=document.getElementById("wq");q.oninput=()=>{wQuery=q.value;wLimit=60;const p=q.selectionStart;R.words();const n=document.getElementById("wq");n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{wTopic=b.dataset.t;wLimit=60;R.words()});

let deck=[],di=0,ruFirst=false,qScore=0;
function buildDeck(mode){
 let L=filtered().filter(w=>w.t!=="sounds");
 if(mode==="learn"){const a=L.filter(w=>st(w.id)===1),b=L.filter(w=>st(w.id)===0);L=a.concat(b).slice(0,20)}
 return L.sort(()=>Math.random()-.5).slice(0,mode==="quiz"?15:40);
}
function startMode(m){dailyMode=null;
 deck=buildDeck(m);di=0;qScore=0;
 if(deck.length<2&&m!=="cards"){toast("Мало слов в этом фильтре");return}
 if(!deck.length){toast("Нет слов в этом фильтре");return}
 if(m==="quiz")quiz();else if(m==="type")typeQ();else cards(m);
}

 <div class="prog" style="margin-top:12px"><span>${di+1} из ${deck.length}</span><button class="btn sm" onclick="ruFirst=!ruFirst;cards('${m}')">${ruFirst?"RU → КБ":"КБ → RU"} ⇄</button></div>

function quiz(){

 <div class="qz-q">${pal(w.k)}</div><div class="qz-s">Выбери перевод · правильно: ${qScore}</div>
 <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.id===w.id?1:0}">${esc(o.r)}</button>`).join("")}</div>`);

 });

async function backup(){const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast("Копия скопирована <i data-i=box></i>")}catch(e){modal(`<h2 style="margin-top:0">Копия</h2><textarea>${esc(t)}</textarea><button class="btn" onclick="closeModal()">Закрыть</button>`)}}

function canon(s){return String(s).toLowerCase().replace(/[l1ӏӀi]/g,"i").replace(/ё/g,"е").replace(/[^а-яi ]/g,"").replace(/\s+/g," ").trim()}
function typeQ(){
 const w=deck[di];
 modal(`<div class="row" style="justify-content:space-between"><b style="color:var(--gold2)"><i data-i=keyboard></i> Пишу сама · ${di+1}/${deck.length}</b><button class="btn sm" onclick="closeModal();R[cur]()">✕</button></div>
 <div class="bar" style="margin:10px 0"><i style="width:${di/deck.length*100}%"></i></div>
 <div class="qz-q" style="font-size:26px">${esc(w.r)}</div><div class="qz-s">Напиши по-кабардински · верно: ${qScore}</div>
 <input class="in typein" id="ti" autocomplete="off" autocapitalize="off" placeholder="…">
 <div class="kbd">${["I","къ","кI","лъ","хъ","щI","пI","гъ","хь"].map(k=>`<button onclick="addCh('${k}')">${k}</button>`).join("")}</div>
 <div id="tres"></div>
 <div class="know"><button class="btn" onclick="showType(true)">Не знаю</button><button class="btn gold" onclick="showType(false)">Проверить</button></div>`);
 const t=document.getElementById("ti");t.focus();t.onkeydown=e=>{if(e.key==="Enter")showType(false)};
}
function addCh(c){const t=document.getElementById("ti");t.value+=c;t.focus()}
function showType(skip){
 const w=deck[di],v=document.getElementById("ti").value,ok=!skip&&canon(v)===canon(w.k);
 if(ok){qScore++;setSt(w.id,Math.max(st(w.id),1))}else{miss(w.id);setSt(w.id,1)}
 document.getElementById("tres").innerHTML=`<div class="res ${ok?"ok":"no"}" style="text-align:center">${ok?"Верно!":"Правильно так:"}</div><div class="ans">${pal(w.k)}</div>`;
 document.querySelector(".know").innerHTML=`${!ok&&!skip?`<button class="btn" onclick="qScore++;nextType()">Я почти права ✓</button>`:"<span></span>"}<button class="btn gold" onclick="nextType()">Дальше →</button>`;
}
function nextType(){di++;if(di>=deck.length&&dailyMode==="wk2"){weeklyFinish();return}if(di>=deck.length){modal(`<div style="text-align:center;padding:20px 0"><div class="bigic">${ic(qScore/deck.length>.7?"trophy":"repeat")}</div><h2>${qScore} из ${deck.length}</h2><p class="sub">Писать самой — самый сильный способ запомнить слово.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn gold" onclick="startMode('type')">Ещё раз</button><button class="btn" onclick="closeModal();R[cur]()">Готово</button></div></div>`);return}typeQ()}

// ===== Собери фразу =====
let bAns=[],bPool=[],bLine=null,bScore=0;
function buildLines(){const L=[];Object.values(DIALOGS).forEach(d=>d.lines.forEach(x=>{if(x[0]==="*")return;x[1].split(/(?<=[.!?])\s+/).forEach(p=>{const w=p.replace(/[«»"()]/g,"").trim().split(/\s+/);if(w.length>=3&&w.length<=7&&!/\//.test(p))L.push({k:p.trim(),r:x[2],w})})}));Object.values(TEXTS).forEach(t=>t.paras.forEach(x=>{x[0].split(/(?<=[.!?])\s+/).forEach(p=>{const w=p.trim().split(/\s+/);if(w.length>=3&&w.length<=7)L.push({k:p.trim(),r:x[1],w})})}));return L}
function buildQ(){
 const L=buildLines();bLine=L[Math.floor(Math.random()*L.length)];bAns=[];
 bPool=bLine.w.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
 if(bPool.every((x,i)=>x.i===i))bPool.reverse();
 drawB();
}
function drawB(res){
 document.getElementById("bld").innerHTML=`<div class="card"><div class="sub" style="font-size:14px">Переведи:</div><div style="font-size:20px;font-weight:800;color:var(--gold2)">${esc(bLine.r)}</div>
 <div class="slots">${bAns.map((x,i)=>`<button class="wchip" onclick="bBack(${i})">${pal(x.t)}</button>`).join("")||'<span class="sub" style="font-size:15px">Нажимай слова ниже…</span>'}</div>
 <div class="pool">${bPool.map((x,i)=>`<button class="wchip" onclick="bTake(${i})">${pal(x.t)}</button>`).join("")}</div>
 ${res?`<div class="res ${res==="ok"?"ok":"no"}">${res==="ok"?"Верно! Отлично!":"Почти! Правильно так:"}</div>${res!=="ok"?`<div style="font-size:19px;font-weight:800">${pal(bLine.k)}</div>`:""}`:""}
 <div class="row" style="margin-top:12px"><button class="btn" onclick="buildQ()"><i data-i=repeat></i>Другая фраза</button>${!res&&!bPool.length?`<button class="btn gold" onclick="bCheck()">Проверить</button>`:""}${res?`<button class="btn gold" onclick="buildQ()">Дальше →</button>`:""}</div>
 <p class="sub" style="font-size:14px;margin-top:10px">Собрано верно: ${bScore}</p></div>`;
}
function bTake(i){bAns.push(bPool.splice(i,1)[0]);drawB()}
function bBack(i){bPool.push(bAns.splice(i,1)[0]);drawB()}
function bCheck(){const ok=bAns.map(x=>x.t).join(" ")===bLine.w.join(" ");if(ok){bScore++;markDay()}drawB(ok?"ok":"no")}

// ===== Аудио (хранится в этом браузере) =====
let DB=null;
function idb(){return new Promise((res,rej)=>{if(DB)return res(DB);try{const r=indexedDB.open("adyghe_audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function audPut(id,blob){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("a","readwrite");t.objectStore("a").put(blob,id);t.oncomplete=res;t.onerror=rej})}
async function audGet(id){try{const db=await idb();return await new Promise(res=>{const r=db.transaction("a").objectStore("a").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}catch(e){return null}}
async function audDel(id){const db=await idb();db.transaction("a","readwrite").objectStore("a").delete(id)}
function audHTML(id){setTimeout(()=>audFill(id),0);return `<div class="aud" id="aud_${id}"></div>`}
async function audFill(id){
 const el=document.getElementById("aud_"+id);if(!el)return;const b=await audGet(id);
 if(b){el.innerHTML=`<audio controls preload="none" src="${URL.createObjectURL(b)}"></audio><button class="btn sm" onclick="audDel('${id}').then(()=>audFill('${id}'))"><i data-i=trash></i>Убрать аудио</button>`}
 else el.innerHTML=`<label class="btn sm filebtn" style="margin:0;text-transform:none;letter-spacing:0;color:var(--white);font-size:14px"><i data-i=sound></i>Прикрепить голосовое учителя<input type="file" accept="audio/*,video/*,.ogg,.oga,.m4a,.mp3,.wav" onchange="audUp('${id}',this)"></label>`;
}
async function audUp(id,inp){const f=inp.files[0];if(!f)return;try{await audPut(id,f);toast("<i data-i=sound></i> Аудио сохранено");audFill(id)}catch(e){toast("Не получилось сохранить аудио")}}

// ===== Свои диалоги =====
function loadMyDlg(){Object.entries(S.mydlg||{}).forEach(([k,d])=>DIALOGS[k]=d)}
loadMyDlg();
function addDlg(id){
 const d=id?S.mydlg[id]:null;
 modal(`<h2 style="margin-top:0"><i data-i=plusdoc></i>${d?"Изменить":"Новый"} диалог</h2>
 <label>Название</label><input class="in" id="dt" placeholder="Напр.: В гостях" value="${d?esc(d.title):""}">
 <label>Текст диалога</label><textarea id="dx" placeholder="Мадинэ: Уи махуэ фIыуэ! (Добрый день!)&#10;ФатIимэ: Нэхъыф1ыжу! (Тебе ещё лучше!)">${d?esc(d.raw||""):""}</textarea>
 <p class="sub" style="font-size:14px">Каждая реплика с новой строки: <b>Имя: кабардинский текст (перевод)</b>. Можно вставить прямо из Telegram — формат как у учителя. Строки без имени станут ремарками.</p>
 <div class="row" style="margin-top:10px"><button class="btn gold" onclick="saveDlg('${id||""}')"><i data-i=save></i>Сохранить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`);
}
function saveDlg(id){
 const title=document.getElementById("dt").value.trim()||"Мой диалог",raw=document.getElementById("dx").value.trim();
 const lines=[],who={};const cols=["a","b","c"];
 raw.split("\n").map(x=>x.trim()).filter(Boolean).forEach(l=>{
  const m=l.match(/^([^:.\-–—]{1,25})\s*[:.\-–—]\s+(.+)$/);
  let name="*",body=l;if(m&&!/[?!]/.test(m[1])){name=norm(m[1].trim());body=m[2]}
  const t=body.match(/^(.*?)\s*\(([^()]*)\)\s*([.!?])?\s*$/);
  const k=norm(t?t[1]:body),r=t?t[2]:"";
  if(name!=="*"&&!who[name])who[name]=cols[Object.keys(who).length%3];
  lines.push([name,k,r||(name==="*"?k:"")]);
 });
 if(!lines.length)return toast("Вставь текст диалога");
 id=id||"my"+Date.now();
 S.mydlg[id]={title,kb:"Мой диалог",date:new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"}),who,lines,raw};
 save();loadMyDlg();closeModal();go("talk",id);toast("<i data-i=save></i>Диалог сохранён");
}
function delDlg(id,b){if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Точно удалить?";return}delete S.mydlg[id];delete DIALOGS[id];save();go("talk")}

// ===== УМНОЕ ДОБАВЛЕНИЕ: вставь текст — приложение разложит сам =====
const KB_RE=/[а-яё]*(?:I|къ|хъ|гъ|лъ|кI|щI|пI|фI|цI|кхъ|уэ|ы)[а-яё]*/i;
function guessTopic(k,r){
 const R=r.toLowerCase();
 if(/[?!]/.test(k)||k.trim().split(/\s+/).length>2)return "phrases";
 const T={people:/гост|мама|мать|отец|папа|брат|сестр|сын|доч|бабуш|дедуш|муж|жена|супруг|ребён|дети|человек|друг|подруг|учител|ученик|врач|продав|невест|свекр|тёщ|сосед|девушк|парень|мужчин|женщин|родств/,
 food:/хлеб|мясо|молок|сыр|чай|вод|соль|сахар|масл|яйц|еда|суп|кефир|сметан|картоф|лук|чеснок|помидор|яблок|фрукт|овощ|завтрак|обед|ужин|мёд|каша|рис|рыб/,
 home:/дом|комнат|кухн|стол|стул|кроват|окн|двер|ковёр|посуд|тарелк|ложк|нож|чашк|ключ|зеркал|двор|улиц|магазин|школ|больниц|мечет|этаж|ворот|книг|ручк|деньг/,
 nature:/лес|гор|рек|мор|небо|солнц|лун|звезд|дерев|цвет|роз|трав|снег|дожд|ветер|камен|поле|сад|огород|село|город|деревн/,
 animals:/собак|кошк|кот|лошад|кур|петух|утк|лис|волк|медвед|птиц|коров|овц|коз|пчел|мыш|сова|ёж/,
 body:/рук|ног|голов|глаз|нос|рот|губ|зуб|ухо|уши|сердц|волос|палец|пальц|живот|спин|ше[яи]|лиц/,
 clothes:/плать|юбк|рубашк|обув|сапог|платок|пальто|шапк|носк|свитер|одежд|брюк|куртк/,
 time:/утро|вечер|ночь|день|сегодня|вчера|завтра|недел|месяц|год|зим|лет[оа]|весн|осен|час|минут|рано|поздно|пятниц|суббот|воскрес|понедел|вторник|сред[аы]|четверг|один|два|три|четыр|пять|шесть|семь|восемь|девять|десять|двадцат|сорок|сто/,
 faith:/аллах|бог|намаз|молитв|благ|баракат|харам|халял|мечт/};
 for(const [t,re] of Object.entries(T))if(re.test(R))return t;
 if(/(ать|ять|еть|ить|оть|уть|ыть|ться|чь|сти|зти)(\s|$|,|\()/.test(R))return "verbs";
 if(/(ый|ий|ой|ая|яя|ое)(\s|$|,)/.test(R))return "adj";
 return "my";
}
function parseAny(raw,force){
 const L=raw.split(/\n/).map(x=>x.replace(/ /g," ").trim());
 const out={words:[],dlg:[],hw:null,text:[],title:""};
 let mode=null;
 for(let line of L){
  if(!line){continue}
  if(/^(лексика|псалъэщ1эхэр|псалъэщIэхэр|новые слова|слова)[\s:(]/i.test(line)||/^лексика$/i.test(line)){mode="w";continue}
  const hm=line.match(/^(?:д\/з|дз|унэ лэжьыгъэ\w*|домашнее задание)\s*(?:на\s*([\d.]+))?/i);
  if(hm){mode="h";out.hw={due:hm[1]||"",items:[]};continue}
  if(/^(диалог|псалъэмакъ)/i.test(line)){mode="d";out.title=out.title||line.replace(/^диалог\s*(на тему)?\s*[-–—:.]?\s*/i,"").replace(/["“”«»]/g,"").trim();continue}
  if(mode==="h"||force==="hw"){const it=line.replace(/^\d+[.)]\s*/,"");if(!out.hw)out.hw={due:"",items:[]};out.hw.items.push(norm(it));continue}
  const dm=line.match(/^([А-ЯЁA-Z][а-яёa-zIl1]{1,14}(?:\s[а-яёIl1]{1,10})?)\s*[:]\s*(.+)$/);
  if((dm&&force!=="words"&&force!=="text")||force==="dialog"&&dm){const t=dm[2].match(/^(.*?)\s*\(([^()]*)\)\s*[.!?]?\s*$/);out.dlg.push([norm(dm[1]),norm(t?t[1]:dm[2]),t?t[2]:""]);continue}
  const wm=line.replace(/^[*•·\-]\s*/,"").match(/^(.+?)\s+[-–—]\s+(.+)$/)||line.replace(/^[*•·]\s*/,"").match(/^([^\s-–—][^-–—]{0,40}?)\s*[-–—]\s*(.+)$/);
  if(wm&&force!=="text"&&force!=="dialog"&&wm[1].length<=45){out.words.push([norm(wm[1].trim()).replace(/^./,c=>c.toUpperCase()),wm[2].trim(),""]);continue}
  const pm=line.match(/^(.*?)\s*\(([^()]{2,})\)\s*[.!?]?$/);
  out.text.push(pm?[norm(pm[1]),pm[2]]:[norm(line),""]);
 }
 out.words.forEach(w=>w[2]=guessTopic(w[0],w[1]));
 if(out.dlg.length===1){const d=out.dlg[0];out.text.unshift([d[0]+": "+d[1],d[2]]);out.dlg=[]}
 return out;
}
let addTarget=null,addForce="auto";
function addAny(target){
 addTarget=target||null;
 const tl=addTarget?S.mylessons.find(x=>x.id===addTarget):null;
 modal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0"><i data-i=plus></i>${tl?"Добавить в урок":"Добавить новое"}</h2><button class="btn sm" onclick="closeModal()">✕</button></div>
 <p class="sub" style="font-size:15px;margin:6px 0 4px">Скопируй сообщение учителя из Telegram и вставь сюда — приложение само разложит слова, диалог, ДЗ и текст.</p>
 <div class="seg">${[["auto","sparkle","Сам решит"],["words","cards","Слова"],["dialog","chat","Диалог"],["hw","pin","ДЗ"],["text","book","Текст / стих"]].map(([k,i,t])=>`<button class="${addForce===k?"on":""}" onclick="addForce='${k}';addAny(addTarget)"><i data-i=${i}></i>${t}</button>`).join("")}</div>
 ${tl?"":`<label>Название урока</label><input class="in" id="at" placeholder="Напр.: Урок 14 — В гостях">`}
 <label>Вставь текст</label><textarea id="ax" style="min-height:200px" placeholder="Лексика:&#10;Хьэщ1э - гость&#10;Шей - чай&#10;&#10;Мадинэ: Къеблагъэ! (Добро пожаловать!)&#10;Залинэ: Упсэу! (Спасибо!)&#10;&#10;Д/з на 20.11&#10;1. Выучить слова&#10;2. Составить диалог"></textarea>
 <div id="apv"></div>
 <div class="row" style="margin-top:10px"><button class="btn" onclick="addPreview()"><i data-i=search></i>Проверить</button><button class="btn gold" onclick="addSave()"><i data-i=save></i>Сохранить</button></div>`);
 const x=document.getElementById("ax");let t;x.oninput=()=>{clearTimeout(t);t=setTimeout(addPreview,400)};
}
function addPreview(){
 const raw=document.getElementById("ax").value;if(!raw.trim()){document.getElementById("apv").innerHTML="";return null}
 const p=parseAny(raw,addForce==="auto"?null:addForce);
 if(addForce==="text"){p.text=p.text.concat(p.words.map(w=>[w[0]+" - "+w[1],""]));p.words=[]}
 const ti=document.getElementById("at");if(ti&&!ti.value&&p.title)ti.value=p.title;
 document.getElementById("apv").innerHTML=`<h3 style="margin:14px 0 4px">Что я нашла</h3>
 ${p.words.length?`<div class="found"><h4><i data-i=cards></i>Слова · ${p.words.length}</h4>${p.words.map(w=>`<div class="li"><b>${pal(w[0])}</b> — <span>${esc(w[1])}</span> <span class="tag">${TOPICS[w[2]]?TOPICS[w[2]].replace(/<[^>]+>/g,"").trim():"Новые"}</span></div>`).join("")}</div>`:""}
 ${p.dlg.length?`<div class="found"><h4><i data-i=chat></i>Диалог · ${p.dlg.length} реплик</h4>${p.dlg.slice(0,6).map(d=>`<div class="li"><b>${pal(d[0])}:</b> ${pal(d[1])} ${d[2]?`<span>(${esc(d[2])})</span>`:""}</div>`).join("")}${p.dlg.length>6?`<div class="li sub">…и ещё ${p.dlg.length-6}</div>`:""}</div>`:""}
 ${p.hw&&p.hw.items.length?`<div class="found"><h4><i data-i=pin></i>ДЗ${p.hw.due?" на "+esc(p.hw.due):""} · ${p.hw.items.length} пункт.</h4>${p.hw.items.map(i=>`<div class="li">${pal(i)}</div>`).join("")}</div>`:""}
 ${p.text.length?`<div class="found"><h4><i data-i=book></i>Текст · ${p.text.length} строк</h4>${p.text.slice(0,5).map(t=>`<div class="li">${pal(t[0])} ${t[1]?`<span>(${esc(t[1])})</span>`:""}</div>`).join("")}${p.text.length>5?`<div class="li sub">…и ещё ${p.text.length-5}</div>`:""}</div>`:""}
 ${!p.words.length&&!p.dlg.length&&!(p.hw&&p.hw.items.length)&&!p.text.length?`<div class="note">Ничего не нашла — проверь текст.</div>`:""}
 <p class="sub" style="font-size:13px">Если что-то попало не туда — выбери тип вверху (Слова, Диалог, ДЗ, Текст).</p>`;
 return p;
}
function addSave(){
 const p=addPreview();if(!p)return toast("Вставь текст");
 const dname=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
 let L=addTarget?S.mylessons.find(x=>x.id===addTarget):null;
 if(!L){const ti=(document.getElementById("at")||{}).value;L={id:"ml"+Date.now(),n:"Мой урок",date:dname,title:(ti||p.title||"Новые материалы").trim(),words:[],mine:1};S.mylessons.push(L)}
 L.words=L.words.concat(p.words);
 if(p.dlg.length){const who={},cols=["a","b","c"];p.dlg.forEach(d=>{if(!who[d[0]])who[d[0]]=cols[Object.keys(who).length%3]});L.dlgData={title:p.title||L.title,kb:"Диалог урока",date:L.date,who,lines:(L.dlgData?L.dlgData.lines:[]).concat(p.dlg)};if(L.dlgData)Object.assign(L.dlgData.who,who);L.dialog="d_"+L.id}
 if(p.hw&&p.hw.items.length){L.hw={due:p.hw.due||(L.hw&&L.hw.due)||"следующий урок",items:((L.hw&&L.hw.items)||[]).concat(p.hw.items)}}
 if(p.text.length){const tr=p.text.filter(t=>t[1]).length;if(tr>=p.text.length/2){L.textData={title:L.title,ru:"Текст урока",date:L.date,paras:((L.textData&&L.textData.paras)||[]).concat(p.text)};L.text="t_"+L.id}else{L.readData={id:"r_"+L.id,type:"Мой текст",date:L.date,kb:((L.readData&&L.readData.kb?L.readData.kb+"\n":"")+p.text.map(t=>t[0]).join("\n")),ru:p.text.filter(t=>t[1]).map(t=>t[1]).join(" ")||"Текст для чтения вслух"}}}
 save();mountMine();WORDS=allWords();closeModal();addForce="auto";
 const parts=[p.words.length?p.words.length+" слов":"",p.dlg.length?"диалог":"",p.hw&&p.hw.items.length?"ДЗ":"",p.text.length?"текст":""].filter(Boolean).join(", ");
 toast("<i data-i=save></i>Добавлено: "+parts);go("lessons");R.lessons(L.id);
}
function mountMine(){
 for(let i=LESSONS.length-1;i>=0;i--)if(LESSONS[i].mine)LESSONS.splice(i,1);
 for(let i=READING.length-1;i>=0;i--)if(READING[i].mine)READING.splice(i,1);
 S.mylessons.forEach(L=>{LESSONS.push(L);if(L.dlgData)DIALOGS[L.dialog]=L.dlgData;if(L.textData)TEXTS[L.text]=L.textData;if(L.readData)READING.push(Object.assign({mine:1},L.readData))});
}
mountMine();WORDS=allWords();
function delLesson(id,b){if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Точно удалить урок?";return}const L=S.mylessons.find(x=>x.id===id);if(L){delete DIALOGS[L.dialog];delete TEXTS[L.text]}S.mylessons=S.mylessons.filter(x=>x.id!==id);save();mountMine();WORDS=allWords();go("lessons")}
function renameLesson(id){const L=S.mylessons.find(x=>x.id===id);modal(`<h2 style="margin-top:0">Название урока</h2><input class="in" id="rn" value="${esc(L.title)}"><label>Дата</label><input class="in" id="rd" value="${esc(L.date)}"><div class="row" style="margin-top:10px"><button class="btn gold" onclick="(()=>{const L=S.mylessons.find(x=>x.id==='${id}');L.title=document.getElementById('rn').value||L.title;L.date=document.getElementById('rd').value||L.date;save();mountMine();closeModal();R.lessons('${id}')})()">Сохранить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`)}

// ===== приложение: заставка, офлайн, перенос прогресса =====
setTimeout(()=>document.getElementById("splash").classList.add("hide"),1700);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
R.home();
</script>
